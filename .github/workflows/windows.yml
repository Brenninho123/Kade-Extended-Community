name: Build Windows

on:
  push:
    branches:
      - master
    paths:
      - 'source/**'
      - 'assets/**'
      - 'Project.xml'
      - 'hmm.json'
      - '.github/workflows/windows.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Cache haxelib dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('hmm.json') }}

      - name: Setup haxelib repository
        run: haxelib setup ${{ github.workspace }}\.haxelib

      - name: Install hmm
        run: haxelib install hmm --quiet

      - name: Clean stale git libraries
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ github.workspace }}\.haxelib" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $gitDir = Join-Path $_.FullName ".current"
            if (Test-Path $gitDir) {
              attrib -r "$($_.FullName)\*.*" /s /d
              Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install dependencies via hmm
        run: haxelib run hmm install --quiet

      - name: Setup Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime setup windows -y

      - name: Build Windows release
        run: haxelib run lime build windows -release -verbose

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KadeExtended-Windows
          path: export/release/windows/bin/
          if-no-files-found: error
