name: Build Windows

on:
  push:
    branches:
      - master
    paths:
      - 'source/**'
      - 'Project.xml'
      - 'hmm.json'
      - '.github/workflows/windows.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Setup haxelib repository
        run: haxelib setup ${{ github.workspace }}\.haxelib

      - name: Install hmm
        run: haxelib install hmm --quiet

      - name: Verify hmm installed
        run: haxelib list hmm

      - name: Install dependencies via hmm
        shell: pwsh
        run: |
          $maxAttempts = 3
          $attempt = 1
          $success = $false
          while (-not $success -and $attempt -le $maxAttempts) {
            Write-Host "hmm install attempt $attempt of $maxAttempts"
            haxelib run hmm install --quiet
            if ($LASTEXITCODE -eq 0) {
              $success = $true
            } else {
              Write-Host "Attempt $attempt failed, retrying..."
              $attempt++
              Start-Sleep -Seconds 5
            }
          }
          if (-not $success) {
            Write-Error "hmm install failed after $maxAttempts attempts"
            exit 1
          }

      - name: Setup Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime setup windows -y

      - name: Build Windows release
        run: haxelib run lime build windows -release -verbose

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KadeExtended-Windows
          path: export/release/windows/bin/
          if-no-files-found: error
